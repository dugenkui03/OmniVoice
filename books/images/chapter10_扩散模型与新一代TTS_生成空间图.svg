<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#27548a"/></marker>
    <style>
      .title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#10213f}
      .sub{font:400 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .h{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f3b63}
      .t{font:400 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .small{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .box{fill:#f8fbff;stroke:#8bb4e7;stroke-width:2;rx:18}
      .gen{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:18}
      .space{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:18}
      .line{stroke:#27548a;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="60" y="74" class="title">第十章：扩散模型与新一代 TTS</text>
  <text x="60" y="114" class="sub">关键问题：diffusion / flow matching 到底发生在哪个生成空间？</text>

  <rect x="110" y="220" width="300" height="180" class="box"/>
  <text x="150" y="270" class="h">random noise（随机噪声）</text>
  <text x="150" y="325" class="t">推理从噪声开始</text>
  <text x="150" y="365" class="small">xT / zT / noisy token state</text>

  <rect x="570" y="220" width="360" height="180" class="gen"/>
  <text x="615" y="270" class="h">diffusion / flow model</text>
  <text x="615" y="325" class="t">多步去噪或连续变换</text>
  <text x="615" y="365" class="small">条件：text、speaker、style、prompt</text>

  <rect x="1090" y="140" width="330" height="110" class="space"/>
  <text x="1130" y="190" class="h">mel 空间</text>
  <text x="1130" y="225" class="small">如 Grad-TTS 类声学扩散</text>
  <rect x="1090" y="285" width="330" height="110" class="space"/>
  <text x="1130" y="335" class="h">waveform 空间</text>
  <text x="1130" y="370" class="small">如 DiffWave 类扩散声码器</text>
  <rect x="1090" y="430" width="330" height="110" class="space"/>
  <text x="1130" y="480" class="h">latent 空间</text>
  <text x="1130" y="515" class="small">压缩表示上生成，更省计算</text>
  <rect x="1090" y="575" width="330" height="110" class="space"/>
  <text x="1130" y="625" class="h">codec token 空间</text>
  <text x="1130" y="660" class="small">适合语音 token / Speech LM</text>

  <path d="M410 310 H560" class="line"/>
  <path d="M930 310 C990 210,1030 195,1080 195" class="line"/>
  <path d="M930 310 H1080" class="line"/>
  <path d="M930 310 C990 455,1030 485,1080 485" class="line"/>
  <path d="M930 310 C1000 595,1035 630,1080 630" class="line"/>

  <rect x="240" y="730" width="1120" height="90" class="box"/>
  <text x="285" y="785" class="t">读论文先问：输入条件是什么？生成空间是什么？采样几步？后面还需不需要 vocoder 或 codec decoder？</text>
</svg>
