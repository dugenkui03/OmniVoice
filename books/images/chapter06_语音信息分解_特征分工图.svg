<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#10213f}
      .sub{font:400 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .h{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f3b63}
      .t{font:400 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .small{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .mix{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:20}
      .a{fill:#eef6ff;stroke:#3b82f6;stroke-width:2;rx:18}
      .b{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:18}
      .c{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;rx:18}
      .d{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:18}
      .line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="60" y="74" class="title">第六章：语音信息分解</text>
  <text x="60" y="114" class="sub">这些分类是工程建模视角：真实语音信号里，信息通常混在一起</text>

  <rect x="590" y="170" width="420" height="180" class="mix"/>
  <text x="685" y="225" class="h">一段语音</text>
  <text x="645" y="275" class="t">waveform / mel / codec token</text>
  <path d="M650 315 C685 280,720 350,755 315 S825 280,860 315 S930 350,965 315" stroke="#475569" stroke-width="5" fill="none"/>

  <rect x="90" y="430" width="310" height="170" class="a"/>
  <text x="125" y="475" class="h">说什么</text>
  <text x="125" y="520" class="t">linguistic content（语言内容）</text>
  <text x="125" y="560" class="small">character / phoneme / pinyin / BPE</text>

  <rect x="455" y="430" width="310" height="170" class="b"/>
  <text x="490" y="475" class="h">怎么读</text>
  <text x="490" y="520" class="t">pronunciation（发音结构）</text>
  <text x="490" y="560" class="small">phoneme / tone / stress / syllable</text>

  <rect x="820" y="430" width="310" height="170" class="c"/>
  <text x="855" y="475" class="h">谁在说</text>
  <text x="855" y="520" class="t">speaker identity（说话人身份）</text>
  <text x="855" y="560" class="small">timbre / speaker embedding / prompt speech</text>

  <rect x="1185" y="430" width="310" height="170" class="d"/>
  <text x="1220" y="475" class="h">怎么说</text>
  <text x="1220" y="520" class="t">prosody / emotion / style</text>
  <text x="1220" y="560" class="small">duration / F0 / energy / pause</text>

  <path d="M715 350 C600 390,390 395,250 425" class="line"/>
  <path d="M770 350 C715 390,650 395,610 425" class="line"/>
  <path d="M830 350 C875 390,940 395,975 425" class="line"/>
  <path d="M890 350 C1010 390,1220 395,1340 425" class="line"/>

  <rect x="300" y="705" width="1000" height="90" class="mix"/>
  <text x="340" y="760" class="t">要点：mel-spectrogram、codec latent、waveform 都不是天然解耦的表示；解耦来自模型设计、监督信号和训练目标。</text>
</svg>
