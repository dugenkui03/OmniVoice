<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#27548a"/></marker>
    <style>
      .title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#10213f}
      .sub{font:400 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .h{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f3b63}
      .t{font:400 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .small{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .box{fill:#f8fbff;stroke:#8bb4e7;stroke-width:2;rx:18}
      .cond{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:18}
      .out{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:18}
      .line{stroke:#27548a;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="60" y="74" class="title">第八章：声学模型 Acoustic Model</text>
  <text x="60" y="114" class="sub">把发音内容、说话人和风格条件，变成模型可还原的声学表示</text>

  <rect x="80" y="210" width="300" height="170" class="box"/>
  <text x="115" y="255" class="h">文本 / 音素</text>
  <text x="115" y="305" class="t">说什么、怎么读</text>
  <text x="115" y="345" class="small">phoneme、pinyin、tone、stress</text>

  <rect x="80" y="480" width="300" height="170" class="cond"/>
  <text x="115" y="525" class="h">条件信息</text>
  <text x="115" y="575" class="t">谁在说、怎么说</text>
  <text x="115" y="615" class="small">speaker、style、emotion、prompt</text>

  <rect x="500" y="340" width="260" height="170" class="box"/>
  <text x="555" y="385" class="h">encoder（编码器）</text>
  <text x="545" y="435" class="t">整理输入条件</text>
  <text x="545" y="475" class="small">生成 hidden states（隐藏表示）</text>

  <rect x="860" y="340" width="260" height="170" class="box"/>
  <text x="905" y="385" class="h">alignment / duration</text>
  <text x="905" y="435" class="t">文本 token 对齐语音帧</text>
  <text x="905" y="475" class="small">防止漏读、重复、节奏漂移</text>

  <rect x="1220" y="340" width="260" height="170" class="out"/>
  <text x="1280" y="385" class="h">decoder（解码器）</text>
  <text x="1260" y="435" class="t">生成 mel / latent</text>
  <text x="1260" y="475" class="small">或 codec token（语音编码 token）</text>

  <path d="M380 295 C430 310,455 360,495 400" class="line"/>
  <path d="M380 565 C430 540,455 490,495 455" class="line"/>
  <path d="M760 425 H850" class="line"/>
  <path d="M1120 425 H1210" class="line"/>

  <rect x="360" y="705" width="880" height="95" class="box"/>
  <text x="405" y="760" class="t">排错直觉：读错先看文本前端；漏读重复看对齐；毛刺爆音更可能看 vocoder。</text>
</svg>
