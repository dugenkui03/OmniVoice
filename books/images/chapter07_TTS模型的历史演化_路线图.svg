<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#10213f}
      .sub{font:400 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .h{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f3b63}
      .t{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .box{fill:#f8fbff;stroke:#93c5fd;stroke-width:2;rx:18}
      .new{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:18}
      .line{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="74" class="title">第七章：TTS 模型的历史演化</text>
  <text x="60" y="114" class="sub">重点不是记模型名，而是理解每一代解决的工程问题</text>

  <g transform="translate(70,210)">
    <rect width="180" height="150" class="box"/><text x="28" y="48" class="h">规则合成</text><text x="28" y="92" class="t">人工规则</text><text x="28" y="122" class="t">可控但机械</text>
  </g>
  <g transform="translate(270,210)">
    <rect width="180" height="150" class="box"/><text x="28" y="48" class="h">拼接式</text><text x="28" y="92" class="t">查库拼片段</text><text x="28" y="122" class="t">自然但泛化差</text>
  </g>
  <g transform="translate(470,210)">
    <rect width="180" height="150" class="box"/><text x="28" y="48" class="h">HMM TTS</text><text x="28" y="92" class="t">统计参数</text><text x="28" y="122" class="t">稳定但平滑</text>
  </g>
  <g transform="translate(670,210)">
    <rect width="180" height="150" class="box"/><text x="28" y="48" class="h">Tacotron</text><text x="28" y="92" class="t">text-to-mel</text><text x="28" y="122" class="t">自然但慢</text>
  </g>
  <g transform="translate(870,210)">
    <rect width="180" height="150" class="box"/><text x="28" y="48" class="h">FastSpeech</text><text x="28" y="92" class="t">显式 duration</text><text x="28" y="122" class="t">快、稳、可控</text>
  </g>
  <g transform="translate(1070,210)">
    <rect width="180" height="150" class="new"/><text x="28" y="48" class="h">VITS</text><text x="28" y="92" class="t">latent + flow</text><text x="28" y="122" class="t">端到端生成</text>
  </g>
  <g transform="translate(1270,210)">
    <rect width="220" height="150" class="new"/><text x="28" y="48" class="h">Diffusion / Flow</text><text x="28" y="92" class="t">从噪声到语音表示</text><text x="28" y="122" class="t">自然、多样、可控</text>
  </g>

  <path d="M250 285 H265" class="line"/><path d="M450 285 H465" class="line"/><path d="M650 285 H665" class="line"/><path d="M850 285 H865" class="line"/><path d="M1050 285 H1065" class="line"/><path d="M1250 285 H1265" class="line"/>

  <rect x="240" y="520" width="1120" height="190" class="box"/>
  <text x="290" y="570" class="h">现代 TTS 的共同方向</text>
  <text x="290" y="620" class="t">1. 从“确定性预测”走向“生成式建模”，处理同一句话的多种合理读法。</text>
  <text x="290" y="665" class="t">2. 从 mel 扩展到 latent、codec token 和 waveform 等不同生成空间。</text>
  <text x="290" y="710" class="t">3. 工程上持续权衡：音质、速度、稳定性、可控性和部署成本。</text>
</svg>
